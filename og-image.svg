<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080a0f"/>

  <!-- Subtle top glow -->
  <ellipse cx="600" cy="0" rx="680" ry="320" fill="#60a5fa" opacity="0.055"/>

  <!-- Decorative border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#22273a" stroke-width="1.5"/>

  <!-- X-ray icon -->
  <text x="600" y="218" font-family="monospace" font-size="88" text-anchor="middle" fill="#e4e8f0" opacity="0.15">🩻</text>

  <!-- Wordmark: Thora -->
  <text x="468" y="308" font-family="monospace" font-size="112" font-weight="700" fill="#e4e8f0" text-anchor="end">Thora</text>
  <!-- Wordmark: Swipe (blue) -->
  <text x="476" y="308" font-family="monospace" font-size="112" font-weight="700" fill="#60a5fa" text-anchor="start">Swipe</text>

  <!-- Divider line -->
  <line x1="440" y1="345" x2="760" y2="345" stroke="#22273a" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="600" y="392" font-family="monospace" font-size="24" fill="#606880" text-anchor="middle" letter-spacing="3">CXR PATTERN RECOGNITION TRAINER</text>

  <!-- Pills row -->
  <rect x="362" y="428" width="148" height="34" rx="17" fill="#1a304f" stroke="#60a5fa" stroke-width="1" opacity="0.7"/>
  <text x="436" y="450" font-family="monospace" font-size="15" fill="#60a5fa" text-anchor="middle">Free</text>

  <rect x="526" y="428" width="148" height="34" rx="17" fill="#1a304f" stroke="#60a5fa" stroke-width="1" opacity="0.7"/>
  <text x="600" y="450" font-family="monospace" font-size="15" fill="#60a5fa" text-anchor="middle">Open Access</text>

  <rect x="690" y="428" width="148" height="34" rx="17" fill="#1a304f" stroke="#60a5fa" stroke-width="1" opacity="0.7"/>
  <text x="764" y="450" font-family="monospace" font-size="15" fill="#60a5fa" text-anchor="middle">Educational</text>

  <!-- Bottom caption -->
  <text x="600" y="546" font-family="monospace" font-size="18" fill="#606880" text-anchor="middle" opacity="0.6">thoraswipe.com</text>
